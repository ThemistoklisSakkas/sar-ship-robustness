# Single source of truth for experiment parameters.
# Phase-specific sections are added as each phase is implemented.

seed: 42

paths:
  data_root: data          # on Colab, overridden to a Google Drive path
  runs_root: runs

dataset:
  name: ssdd
  num_classes: 1
  class_names: [ship]
  val_fraction: 0.15     # carved from the official train set only
  min_box_size: 1.0      # px; thinner boxes are dropped and counted
  raw_subdir: BBox_SSDD/voc_style   # horizontal boxes, VOC XML
  yolo_dirname: ssdd_yolo
  drop_train_test_duplicates: true   # remove train copies of test images (leakage)
  to_grayscale: true     # SAR is single-channel: colour images are converted
  colour_threshold: 16   # grey levels between channels that count as colour
  colour_min_fraction: 0.001   # image is colour if > 0.1% of pixels are coloured
  viz_samples: 8         # images per grid in the visual checks

model:
  weights: yolo11n.pt      # baseline; larger model compared in phase 6

train:
  imgsz: 640
  epochs: 100
  batch: 16
  patience: 30           # early stop if val fitness does not improve for 30 epochs
  optimizer: auto        # Ultralytics picks SGD/AdamW and lr from the run length
  workers: 2             # Colab has 2 CPU cores
  close_mosaic: 10       # last 10 epochs without mosaic, on "real-looking" images
  deterministic: true
  # Augmentation: Ultralytics defaults, except the colour jitter, which has no
  # physical meaning for single-channel SAR (hue/saturation of a grey image).
  augment:
    hsv_h: 0.0
    hsv_s: 0.0
    hsv_v: 0.4           # brightness/gain variation: plausible for SAR calibration
    degrees: 0.0
    translate: 0.1
    scale: 0.5
    fliplr: 0.5
    flipud: 0.0
    mosaic: 1.0
    mixup: 0.0

eval:
  conf: 0.001            # keep almost all boxes: AP integrates over every threshold
  iou_nms: 0.7           # NMS IoU threshold (Ultralytics default)
  batch: 16
  examples:              # good/bad prediction grids on the test set
    conf: 0.25           # a realistic operating threshold for "what an operator sees"
    iou_match: 0.5       # TP if IoU >= 0.5 with an unmatched ground-truth box
    n: 8

analysis:
  # COCO-style area bins in pixels^2 (on the original image scale)
  size_bins:
    small: [0, 1024]       # < 32^2
    medium: [1024, 9216]   # 32^2 .. 96^2
    large: [9216, .inf]    # >= 96^2
  predict_conf: 0.001    # cached test predictions keep (almost) every box, as for mAP
  overlap_iou: 0.1       # "a box is near this ship" for the error reasons
  border_margin_px: 2    # a box this close to the edge "touches the border"
  bootstrap_resamples: 1000
  bootstrap_ci: 0.95
  gallery_n: 24          # crops per error gallery
